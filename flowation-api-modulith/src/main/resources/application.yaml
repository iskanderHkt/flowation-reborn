spring:
  application:
    name: flowation-api-modulith
  datasource:
    url: jdbc:postgresql://localhost:4321/flowation-db
    username: fw_user
    password: fw_password
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
server:
  port: 2121
flowation:
  execution:
    max-nesting-depth: 10

logging:
  level:
    # SLF4J логи из HttpOperationExecutor (>>> REQUEST / <<< RESPONSE)
    kg.ademity.flowation_api_modulith.execution_module.executor.HttpOperationExecutor: DEBUG
    # Wire-level логи из JDK HttpClient (включая Host, Content-Length, которые HttpClient добавляет сам)
    # Работает только если JVM запущена с: -Djdk.httpclient.HttpClient.log=requests,headers,content,errors
    jdk.internal.net.http: DEBUG
